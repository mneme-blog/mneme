# Dependabot watches all three ecosystems this repo ships from. For an E2EE
# product whose crypto comes from npm (@noble/*, @scure/*), "nothing watches
# the dependencies" is the first thing an auditor flags — weekly is enough,
# grouped so routine bumps arrive as one PR per ecosystem instead of ten.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "gomod"
    directory: "/server"
    schedule:
      interval: "weekly"
    groups:
      gomod-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
