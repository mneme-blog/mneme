# CI for the relay (Go) and the client (Vite + Preact). Exists chiefly so a
# go.mod/go.sum semantic merge conflict (see PR #4) can never land green again:
# `go build` on a fresh checkout is exactly the check that catches it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default: the build/test jobs only check out the repo, so read
# access to contents is all they need — nothing writes back. Declaring this
# explicitly satisfies CodeQL's actions/missing-workflow-permissions. The one
# exception, main-images, raises `packages: write` for itself at the job level.
permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: journal
          POSTGRES_PASSWORD: journal_dev
          POSTGRES_DB: journal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U journal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - name: e2e (live Postgres)
        run: go test -tags e2e ./e2e/...
        env:
          TEST_DATABASE_URL: postgres://journal:journal_dev@localhost:5432/journal?sslmode=disable
          # The suite refuses to run against a non-"test"-named database unless
          # explicitly allowed — it truncates everything. This Postgres is an
          # ephemeral CI service container, so wiping it is the point.
          E2E_ALLOW_WIPE: "1"

  # The host-side updater agent restarts production stacks, so it gets exercised
  # here against stubbed docker/compose rather than only ever in anger. Covers
  # the automatic-rollback path, which is the whole reason the feature is safe.
  updater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck deploy/install.sh deploy/updater/mneme-updater.sh deploy/updater/install.sh deploy/prod.sh
      - name: updater regression tests
        run: ./deploy/updater/updater-test.sh

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # reads the version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck + build
        run: pnpm --filter client build
      # The client regression suite (jsdom + pure-logic repro scripts, incl. the
      # security-critical ones: record-binding, seedlock-methods, link-safety,
      # ollama-url). The relay-dependent roundtrip scripts and film-e2e.mjs
      # (real Chrome) stay manual — see docs/CONTRIBUTING.md.
      - name: regression checks
        run: pnpm --filter client check

  # Publish images for the head of main — the admin dashboard's "Switch to
  # main" development channel. Gated on every other job being green, so a
  # main-<sha> image always corresponds to a commit that passed CI; the relay
  # offers exactly this tag (it derives it from the same commit sha via the
  # GitHub API). Tags are immutable per-commit — never a moving `main` alias —
  # because the updater pins by tag and records "previous" for rollback, both
  # of which need a tag that keeps meaning the same image. Both architectures,
  # like a release: a homelab on ARM must not find the tag amd64-only.
  main-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [server, updater, client]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the images to GHCR
    steps:
      - uses: actions/checkout@v7

      # The short sha both sides agree on: 7 hex chars, lowercase.
      - name: Resolve the main-build tag
        run: |
          echo "TAG=main-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "Publishing **main-${GITHUB_SHA::7}**" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-qemu-action@v4 # emulation for the arm64 leg
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # VERSION is stamped into the binary (main.version), so `journald version`
      # and the dashboard report main-<sha> — which is also how the update check
      # recognises that the running build IS the head of main.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.TAG }}
          tags: ghcr.io/plasticparticle/mneme-server:${{ env.TAG }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/plasticparticle/mneme-web:${{ env.TAG }}
