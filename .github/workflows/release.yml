# Cut a release: on a pushed vX.Y.Z tag, build + publish the relay image and
# create the GitHub Release. The Release is what the admin dashboard's update
# check reads (GET /repos/plasticparticle/mneme/releases/latest), so the
# "newer version available" banner only lights up once a tag has been released.
#
#   git tag v0.3.0 && git push origin v0.3.0
name: release

on:
  push:
    tags: ["v*"]
  # Lets an existing tag be (re)published by hand, and is how the "Bump version
  # and release" workflow hands off — a tag it pushed with GITHUB_TOKEN would
  # never fire the `push` trigger above, because GitHub does not start workflows
  # from GITHUB_TOKEN-generated events. workflow_dispatch is one of the two
  # documented exceptions.
  #
  # Actions → release → Run workflow, then TYPE THE TAG in the box. The ref
  # dropdown next to it can stay on main: it defaults there and lists branches
  # before tags, so relying on it is a reliable way to get this wrong. The tag
  # you type is what gets checked out, built, and published.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.3.0 (leave empty only if the ref dropdown is already set to a tag)"
        type: string
        required: false

permissions:
  contents: write # create the GitHub Release
  packages: write # push the image to GHCR

jobs:
  # Settle on one tag for the whole workflow: it becomes the ref that gets
  # checked out, the image tag, the version compiled into the binary, and the
  # release to create. The typed input wins; otherwise fall back to the ref the
  # run started on, which is what the `push` trigger and the bump workflow's
  # handoff both rely on.
  #
  # Guarded, because a bare dispatch with an empty box lands here as "main" —
  # which would publish an image tagged `main` and try to create a release
  # called `main`. Fail before anything is checked out.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::'$TAG' is not a version tag. Type the tag (e.g. v0.3.0) into the 'tag' box when running this workflow." && exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing **$TAG**" >> "$GITHUB_STEP_SUMMARY"

  # The same gates CI runs on every PR, at the tag's ref. A release publishes
  # images that the one-click updater then offers to every install — an
  # untested tag must never get that far. (A tag cut from a green main commit
  # re-runs these redundantly; that redundancy is cheap and closes the gap for
  # tags cut from anywhere else.)
  test:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: journal
          POSTGRES_PASSWORD: journal_dev
          POSTGRES_DB: journal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U journal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: server tests
        working-directory: server
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go build ./...
          go test ./...
          go test -tags e2e ./e2e/...
        env:
          TEST_DATABASE_URL: postgres://journal:journal_dev@localhost:5432/journal?sslmode=disable
          E2E_ALLOW_WIPE: "1" # ephemeral CI service container
      - name: shellcheck + updater tests
        run: |
          shellcheck deploy/updater/mneme-updater.sh deploy/updater/install.sh deploy/prod.sh
          ./deploy/updater/updater-test.sh
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: client build + regression checks
        run: |
          pnpm --filter client build
          pnpm --filter client check

  release:
    needs: [resolve, test]
    runs-on: ubuntu-latest
    steps:
      - name: Export the tag
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: echo "TAG=$TAG" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          # Check out the resolved tag, not the dispatch ref — otherwise typing
          # a tag while the dropdown says main would build main's code under
          # that tag's name.
          ref: ${{ env.TAG }}

      - uses: docker/setup-qemu-action@v4 # emulation for the arm64 leg
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version is stamped into the binary (main.version) via the Dockerfile
      # ARG, so `journald version` and the dashboard report the released tag.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.TAG }}
          tags: |
            ghcr.io/plasticparticle/mneme-server:${{ env.TAG }}
            ghcr.io/plasticparticle/mneme-server:latest

      # The web image (client bundle + Caddy) is published too, because the
      # one-click updater moves the stack by PULLING images. Without a released
      # web image an update could only ever advance the relay, leaving the app
      # bundle at whatever the host last built — a split-version deployment.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/plasticparticle/mneme-web:${{ env.TAG }}
            ghcr.io/plasticparticle/mneme-web:latest

      # The schema manifest: which migration head this release lands on, and how
      # far back it can be rolled back without restoring a backup. A relay reads
      # it BEFORE applying an update, so the dashboard can warn honestly when a
      # release contains a migration that an image swap cannot undo.
      #
      # Generated by the binary itself (`journald schema-info`) so the parser
      # that answers this question is the same one the relay ships with.
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Generate the schema manifest
        working-directory: server
        run: |
          go run -ldflags "-X main.version=$TAG" ./cmd/journald schema-info --out ../mneme-release.json
          cat ../mneme-release.json

      # Created with the preinstalled `gh` rather than a third-party action.
      # This repository restricts Actions to GitHub-owned + verified creators
      # (plus pnpm/action-setup), and softprops/action-gh-release is neither —
      # which failed the whole workflow at startup, before any step ran. Using
      # gh also keeps one less third-party action in a pipeline that holds
      # `contents: write` and `packages: write`.
      #
      # --generate-notes fills in the commit/PR summary; a curated body can be
      # added afterwards with `gh release edit --notes-file`.
      #
      # Idempotent, because there are two ways a tag arrives here. Pushing a tag
      # from the CLI fires this workflow with no Release yet, so we create one.
      # Publishing from the Releases UI creates the Release FIRST and pushes the
      # tag as a side effect — `gh release create` would then fail on an already
      # existing release and turn the run red even though the image published
      # fine. In that case the notes the operator wrote in the UI are the good
      # ones, so leave them alone.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — keeping its notes."
          else
            gh release create "$TAG" --verify-tag --generate-notes
          fi
          # --clobber so re-publishing an existing tag replaces the manifest
          # rather than failing on the asset already being attached.
          gh release upload "$TAG" mneme-release.json --clobber
