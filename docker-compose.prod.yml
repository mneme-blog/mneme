# Production stack — LAN-only deployment with rolling backups and
# restart-on-boot. Secrets live in .env.prod (never committed); run everything
# through the wrapper so the right env file is picked up:
#
#   ./deploy/prod.sh up -d --build      # build + start
#   ./deploy/prod.sh logs -f server     # follow relay logs
#   ./deploy/prod.sh down               # stop (volumes/data survive)
#
# See docs/MAINTENANCE.md for the full runbook (backups, restore, TLS).
name: mneme-prod

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: journal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
      POSTGRES_DB: journal
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journal"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env.prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env.prod}
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    # Released images are the default so the stack can be moved between versions
    # by pulling, which is what makes the /admin "update" button possible. The
    # tag is pinned in deploy/version.env, rewritten by the updater agent on
    # every apply and rollback; unset, it falls back to :latest.
    #
    # `build:` stays alongside it: `./deploy/prod.sh up -d --build` still builds
    # from the working tree and tags the result as this image name, so a source
    # deployment works exactly as before. The updater always passes --no-build.
    image: ${MNEME_SERVER_IMAGE:-ghcr.io/plasticparticle/mneme-server:latest}
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        # Stamped into the binary as the build version. deploy/prod.sh exports
        # MNEME_VERSION=$(git describe --tags --always); falls back to "dev".
        VERSION: "${MNEME_VERSION:-dev}"
    restart: unless-stopped
    # The updater's health gate reads this. `journald healthcheck` probes /readyz,
    # which is only OK once migrations have run and Postgres is reachable — so a
    # release that cannot migrate is detected as unhealthy and rolled back.
    healthcheck:
      test: ["CMD", "/journald", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    environment:
      DATABASE_URL: postgres://journal:${POSTGRES_PASSWORD}@postgres:5432/journal?sslmode=disable
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: journal-media
      LISTEN_ADDR: ":8080"
      # Everything is same-origin behind Caddy — no cross-origin callers exist,
      # so the allowlist is deliberately EMPTY (not unset: unset would fall back
      # to the dev default "*" and reflect any origin).
      CORS_ORIGINS: ""
      # Operator dashboard at /admin; unset to disable it entirely.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Gate new vaults behind operator approval (needs ADMIN_TOKEN to approve).
      # Default off = open relay. Set true for a single-tenant / hand-picked relay.
      REQUIRE_APPROVAL: ${REQUIRE_APPROVAL:-false}
      # Dashboard update check (GitHub releases); set off for air-gapped hosts.
      UPDATE_CHECK: ${UPDATE_CHECK:-on}
      # One-click updates from /admin. Empty (the default) = the dashboard reports
      # new releases but offers no button. Set to the container spool path below
      # ONLY after installing the host agent (deploy/updater/install.sh does both).
      # The relay never gains host access: it writes a request here, and the
      # root-owned agent on the host is what acts on it.
      UPDATE_SPOOL_DIR: ${UPDATE_SPOOL_DIR:-}
      # Per-IP throttle on the unauthenticated auth endpoints (0 disables).
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-30}
      RATE_LIMIT_AUTH_BURST: ${RATE_LIMIT_AUTH_BURST:-15}
      # Guesses at ADMIN_TOKEN, per IP. Charged on failure only, so the
      # dashboard's own polling never spends from it.
      RATE_LIMIT_ADMIN_PER_MINUTE: ${RATE_LIMIT_ADMIN_PER_MINUTE:-10}
      RATE_LIMIT_ADMIN_BURST: ${RATE_LIMIT_ADMIN_BURST:-10}
      # Caddy fronts the relay here, so the socket address is always Caddy's:
      # read the real client address from the forwarded headers it sets.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      # Per-owner storage cap in bytes (entries + finalized media). 0 = unlimited.
      QUOTA_BYTES_PER_OWNER: ${QUOTA_BYTES_PER_OWNER:-0}
      # Rolling encrypted-blob archives of every vault (see docs/MAINTENANCE.md).
      BACKUP_DIR: /backups
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-24h}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      # Bind mount on the host so archives are trivial to copy off-box.
      - ${BACKUP_HOST_DIR:?set in .env.prod}:/backups
      # The update spool, shared with the host agent. Mounted unconditionally
      # (compose cannot mount conditionally) but inert until UPDATE_SPOOL_DIR is
      # set above — an unused spool directory costs nothing.
      - ${UPDATE_SPOOL_HOST_DIR:-./deploy/updater/spool}:/var/lib/mneme/spool
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }

  # Bundled speech-to-text for the client's transcription feature (opt-in per
  # use in the app; the client's default server URL points here, proxied by
  # Caddy under /mneme/whisper so it shares the app's origin — no CSP or CORS
  # config needed). Speaches is OpenAI-API-compatible; the model itself is
  # installed once by the whisper-model service below. The whole stack is
  # MIT-licensed (speaches, faster-whisper, CTranslate2, and the OpenAI whisper
  # weights). Remove both services to run without transcription — the client
  # feature simply errors/switches off when the endpoint is absent.
  whisper:
    image: ghcr.io/speaches-ai/speaches:0.8.2-cpu
    restart: unless-stopped
    environment:
      # Load-bearing, not cosmetic: a model download runs through
      # huggingface_hub's thread_map, whose tqdm progress bar hits a known
      # thread-safety bug (huggingface_hub#3285 — ensure_lock deletes
      # tqdm._lock while a concurrent bar still needs it) and dies mid-download
      # with `AttributeError: type object 'tqdm' has no attribute '_lock'`,
      # surfacing as a 500 from POST /v1/models/{id}. Disabling the progress
      # bars takes tqdm's disabled path, which never touches that lock. A
      # container has no terminal to draw them on anyway.
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      # CTranslate2's "default" compute type on CPU is float32 — for large-v3-
      # turbo that is ~3 GB resident and markedly slower. int8 is the standard
      # CPU quantization: roughly a third of the memory, faster, and no accuracy
      # cost worth hearing at this model size. Harmless on a GPU image, which
      # picks its own preferred type.
      WHISPER__COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
    volumes:
      - whisper_models:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://0.0.0.0:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Speaches does NOT fetch a model on demand: a transcription for a model that
  # is not in its cache is answered with 404 (its routers/stt.py), which reaches
  # the user as an unexplained "404" on the Transcribe button. So install the
  # client's default model into the cache volume once, here — it needs egress to
  # huggingface.co and pulls ~1.6 GB the first time; afterwards the call is
  # idempotent (200 downloaded / 201 already present) and the container exits
  # immediately. It runs in the whisper image itself (already pulled, ships
  # curl), so it costs no extra download. WHISPER_MODEL overrides the model;
  # keep it in step with the app's DEFAULT_TRANSCRIPTION_MODEL
  # (apps/client/src/ai/types.ts). The client's AI settings can install a model
  # too ("Check server" → "Download model").
  #
  # It retries: a download that long fails often enough that one-shot-and-give-up
  # would leave an otherwise healthy deployment answering every transcription
  # with "the server has no model", and nothing on the box says to try again.
  whisper-model:
    image: ghcr.io/speaches-ai/speaches:0.8.2-cpu
    restart: "no"
    depends_on:
      whisper: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        echo "installing speech model ${WHISPER_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2} (first run downloads ~1.6 GB)";
        for i in 1 2 3 4 5; do
          if curl -fsS --max-time 7200 -X POST "http://whisper:8000/v1/models/${WHISPER_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2}" >/dev/null; then echo "whisper model ready: ${WHISPER_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2}"; exit 0; fi;
          echo "attempt $$i failed; retrying in 10s";
          sleep 10;
        done;
        echo "could not install the speech model - transcription will report no model until it succeeds";
        exit 1

  web:
    # Same story as `server` above: released image by default, still buildable
    # from source with `--build`.
    image: ${MNEME_WEB_IMAGE:-ghcr.io/plasticparticle/mneme-web:latest}
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set in .env.prod}
      # Served to clients that connect by bare IP (no SNI in the handshake).
      DEFAULT_SNI: ${DEFAULT_SNI:?set in .env.prod}
      # The one model the /whisper proxy will accept an install request for.
      # Keep it equal to the whisper-model service's model above — the proxy
      # allowlists this exact path so an open install endpoint can't be used to
      # pull arbitrary Hugging Face repositories onto the host.
      WHISPER_MODEL: ${WHISPER_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2}
    ports:
      - "80:80" # redirects to https
      - "443:443"
    volumes:
      - caddy_data:/data # internal CA + issued certs persist here
      - caddy_config:/config
    depends_on: [server]

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:
  whisper_models:
