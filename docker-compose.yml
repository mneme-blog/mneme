services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: journal
      POSTGRES_PASSWORD: journal_dev
      POSTGRES_DB: journal
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journal"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_dev
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbuckets:
    image: minio/mc
    depends_on: { minio: { condition: service_started } }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin_dev &&
      mc mb -p local/journal-media || true;
      exit 0;"

  server:
    # Build context is the repo root so the Dockerfile can COPY server/… .
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        VERSION: "${MNEME_VERSION:-dev}"
    environment:
      DATABASE_URL: postgres://journal:journal_dev@postgres:5432/journal?sslmode=disable
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin_dev
      S3_BUCKET: journal-media
      LISTEN_ADDR: ":8080"
      ADMIN_TOKEN: admin_dev # local dev only — set a real secret (or leave unset to disable /admin) in prod
      BACKUP_DIR: /backups # encrypted-blob archives of every vault; unset to disable scheduled backups
      BACKUP_INTERVAL: 24h
      BACKUP_KEEP: "7" # retained archives (newest first); 0 keeps all
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
    ports: ["8080:8080"]
    volumes: ["backups:/backups"] # persist archives across container restarts; copy these off-box for real DR

  # Speech-to-text for the transcription feature (MIT stack). Dev exposes :8000
  # directly; the vite dev server also proxies /whisper here so the client's
  # bundled same-origin default URL works in dev exactly like behind Caddy.
  whisper:
    image: ghcr.io/speaches-ai/speaches:0.8.2-cpu
    environment:
      # Load-bearing, not cosmetic: a model download runs through
      # huggingface_hub's thread_map, whose tqdm progress bar hits a known
      # thread-safety bug (huggingface_hub#3285 — ensure_lock deletes
      # tqdm._lock while a concurrent bar still needs it) and dies mid-download
      # with `AttributeError: type object 'tqdm' has no attribute '_lock'`,
      # surfacing as a 500 from POST /v1/models/{id}. Disabling the progress
      # bars takes tqdm's disabled path, which never touches that lock. A
      # container has no terminal to draw them on anyway.
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      # CTranslate2's "default" compute type on CPU is float32 — for large-v3-
      # turbo that is ~3 GB resident and markedly slower. int8 is the standard
      # CPU quantization: roughly a third of the memory, faster, and no accuracy
      # cost worth hearing at this model size. Harmless on a GPU image, which
      # picks its own preferred type.
      WHISPER__COMPUTE_TYPE: int8
    volumes: [whispermodels:/home/ubuntu/.cache/huggingface/hub]
    ports: ["8000:8000"]

  # Speaches does NOT fetch a model on demand: a transcription for a model that
  # is not in its cache is answered with 404 (its routers/stt.py), which reaches
  # the user as an unexplained "404" on the Transcribe button. So install the
  # client's default model once, here — a fresh clone needs no setup step of its
  # own, `docker compose up -d` leaves a working speech server behind. The call
  # is idempotent (200 downloaded / 201 already present), so every later `up` is
  # a single fast HTTP call. Runs in the whisper image itself — already pulled,
  # and it ships curl — so this costs no extra download. WHISPER_MODEL overrides
  # the model; keep it in step with the app's DEFAULT_TRANSCRIPTION_MODEL
  # (apps/client/src/ai/types.ts). The client's AI settings can install one too
  # ("Check server" → "Download model") if this ever fails.
  #
  # The first run pulls ~1.6 GB from Hugging Face and takes minutes. It retries,
  # because a download that long fails often enough that one-shot-and-give-up
  # would strand people on "the server has no model" with no hint to retry.
  whisper-model:
    image: ghcr.io/speaches-ai/speaches:0.8.2-cpu
    depends_on: [whisper]
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until curl -fsS http://whisper:8000/health >/dev/null 2>&1; do sleep 2; done;
        echo "installing speech model ${WHISPER_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2} (first run downloads ~1.6 GB)";
        for i in 1 2 3 4 5; do
          if curl -fsS --max-time 7200 -X POST "http://whisper:8000/v1/models/${WHISPER_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2}" >/dev/null; then echo "whisper model ready: ${WHISPER_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2}"; exit 0; fi;
          echo "attempt $$i failed; retrying in 10s";
          sleep 10;
        done;
        echo "could not install the speech model - transcription will report no model until it succeeds";
        exit 1

  # Optional: client dev server in compose (otherwise just run `pnpm dev`).
  client:
    profiles: ["fullstack"]
    image: node:22
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm --filter client dev --host"
    volumes: [".:/app"]
    ports: ["5173:5173"]
    depends_on: [server]

volumes:
  pgdata:
  miniodata:
  backups:
  whispermodels:
