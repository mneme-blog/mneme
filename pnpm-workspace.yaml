packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  esbuild: true

# Dependency overrides.
#
# These live HERE, not under a "pnpm" key in package.json: pnpm 10 moved
# settings to this file, and pnpm 11 ignores the old location outright — with
# only a warning. That is worth knowing about, because this project already got
# caught by it once. An `esbuild: ^0.28.1` override added to clear two
# advisories silently stopped applying on the pnpm 11 upgrade, and nobody
# noticed because the install still succeeded. (It turned out not to matter:
# one advisory was withdrawn and the other only affects >= 0.27.3, so the
# esbuild vite resolves on its own is unaffected — the override is gone rather
# than moved.)
#
# Everything below is a TRANSITIVE devDependency of the build toolchain — none
# of it reaches the browser bundle — pinned forward past an advisory because
# the direct parent's range would otherwise hold it back.
overrides:
  # GHSA-mh99-v99m-4gvg (and GHSA-3jxr-9vmj-r5cp for the 2.x line). Two majors
  # are in the tree with different APIs, so each is pinned within its own line
  # rather than collapsing both onto one version.
  'brace-expansion@2': '^2.1.3'
  'brace-expansion@5': '^5.0.8'
  # GHSA-v2hh-gcrm-f6hx
  'fast-uri': '^3.1.4'
  # GHSA-r28c-9q8g-f849
  'postcss': '^8.5.18'
